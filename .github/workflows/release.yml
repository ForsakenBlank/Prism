# Builds Spootify for Linux, Windows and Android. Pushing a tag like v1.2.3 publishes all
# three as a GitHub release (the desktop apps' "Check for updates" reads that release).
# Running it by hand from the Actions tab just builds them, as downloadable artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            script: build-linux
            folder: Spootify-linux-x64
            asset: Spootify-linux-x64.tar.gz
          - os: windows-latest
            script: build-exe
            folder: Spootify-win32-x64
            asset: Spootify-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set the app version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
      - run: npm run ${{ matrix.script }}
      - name: Pack (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.asset }} -C dist ${{ matrix.folder }}
      - name: Pack (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/${{ matrix.folder }} -DestinationPath ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # The Android SDK comes preinstalled on GitHub's Ubuntu machines (ANDROID_HOME);
      # Gradle downloads any platform version it's missing.
      - run: npm ci
      - name: Set the app version from the tag
        shell: bash
        run: |
          V="1.0.0"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; fi
          IFS=. read -r MA MI PA <<< "${V%%-*}"
          echo "SPOOTIFY_VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "SPOOTIFY_VERSION_CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))" >> "$GITHUB_ENV"
      - run: npm run sync-android
      - name: Unpack the signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "SPOOTIFY_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build the APK
        working-directory: android
        env:
          SPOOTIFY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SPOOTIFY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SPOOTIFY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$SPOOTIFY_KEYSTORE" ]; then
            ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../Spootify-android.apk
          else
            echo "::warning::No signing key in the repo secrets: building a debug APK, which won't install over an earlier one."
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../Spootify-android.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Spootify-android.apk
          path: Spootify-android.apk

  release:
    needs: [desktop, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
